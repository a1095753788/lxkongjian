name: Build APK

on:
  push:
    branches: [master]
    paths:
      - 'local_douyin/lib/**'
      - 'local_douyin/android/**'
      - 'local_douyin/pubspec.yaml'
      - 'local_douyin/pubspec.lock'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            echo "platform 36 not found, installing..."
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
              "platforms;android-36" "build-tools;36.0.0" || true
          fi
          echo "--- installed platforms ---"
          ls "$SDK/platforms" || true
          echo "--- installed build-tools ---"
          ls "$SDK/build-tools" || true

      - name: Install dependencies
        working-directory: local_douyin
        run: flutter pub get

      - name: Build debug APK
        working-directory: local_douyin
        run: flutter build apk --debug

      - name: Report APK size
        working-directory: local_douyin
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local_douyin-debug-apk
          path: local_douyin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
