name: Build APK

on:
  push:
    branches: [master]
    paths:
      - 'local_douyin/lib/**'
      - 'local_douyin/android/**'
      - 'local_douyin/pubspec.yaml'
      - 'local_douyin/pubspec.lock'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定 3.44.2：这是本项目 AGP 9.0.1 + Gradle 9.1.0 验证过的版本
          # （Dart 3.12.2，满足 pubspec 的 >=3.12.0 约束）
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # AGP 9.0.1 硬性要求：compileSdk 36 + build-tools >= 36.0.0 + JDK 17 + Gradle 9.1.0
      # 无条件安装，sdkmanager 对已存在的组件会直接跳过
      - name: Ensure Android SDK 36 + build-tools 36.0.0
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          echo "--- platforms ---";  ls "$SDK/platforms"  || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      # 项目为国内网络环境配置了阿里云 maven 镜像并排在仓库列表最前面。
      # GitHub runner 在境外，访问 maven.aliyun.com 会超时/被拒，且排在最前会
      # 让 Gradle 先卡在那里。CI 里直接移除，只用 google()/mavenCentral()。
      - name: Drop CN maven mirrors (CI runs outside China)
        run: |
          sed -i '/maven.aliyun.com/d' local_douyin/android/settings.gradle.kts \
                                        local_douyin/android/build.gradle.kts
          echo "--- settings.gradle.kts repositories ---"
          grep -n "maven\|google()\|mavenCentral\|gradlePluginPortal" \
            local_douyin/android/settings.gradle.kts || true
          echo "--- build.gradle.kts repositories ---"
          grep -n "maven\|google()\|mavenCentral" local_douyin/android/build.gradle.kts || true

      - name: Point Gradle wrapper at official distribution
        run: |
          # wrapper 指向腾讯云镜像（为国内网络优化），境外访问可能不通，
          # 且分发包下载失败不会 fallback，会直接中断构建。
          F=local_douyin/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' "$F"
          cat "$F"

      - name: Install dependencies
        working-directory: local_douyin
        run: flutter pub get

      # video_thumbnail 0.5.6（pub 上的最新版，2025-05 之后停更）的
      # android/build.gradle 里还在调用 jcenter()。jcenter 在 Gradle 8 已废弃、
      # Gradle 9 被彻底移除，而本项目用 Gradle 9.1.0，插件一加载就报
      # "Could not find method jcenter()"，进而连带 'kotlin-android' plugin
      # requires one of the Android Gradle plugins 一起失败。
      # pub 上没有可用新版本，只能在 CI 里把这一行删掉。
      - name: Patch video_thumbnail (jcenter removed in Gradle 9)
        run: |
          echo "HOME=$HOME  PUB_CACHE=${PUB_CACHE:-<unset>}"
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "cache root: $CACHE"

          FILES=$(find "$CACHE" -path "*video_thumbnail*/android/build.gradle" 2>/dev/null || true)
          echo "--- found ---"
          echo "$FILES"
          if [ -z "$FILES" ]; then
            echo "::error::video_thumbnail build.gradle not found under $CACHE"
            exit 1
          fi

          # 全部打补丁：pub-cache 里可能残留多个版本，只改第一个会漏。
          # 注意是把 jcenter() 替换成 mavenCentral()，不能直接删：
          # 这个包的 buildscript 里只声明了 google()，而它依赖的 asm/protobuf/
          # proguard 等老库不在 Google 仓库，删掉 jcenter 会导致
          # "Could not resolve all artifacts for configuration 'classpath'"。
          for F in $FILES; do
            sed -i 's|jcenter()|mavenCentral()|g' "$F"
            echo "--- patched: $F ---"
            if grep -q "jcenter" "$F"; then
              echo "::warning::jcenter still present in $F"
            else
              echo "clean"
            fi
            grep -n "mavenCentral\|google()" "$F" || true
          done

          # 写进 step summary，失败时也能直接看到补丁结果
          {
            echo "### video_thumbnail 补丁"
            echo '```'
            for F in $FILES; do echo "$F"; grep -n "jcenter\|mavenCentral" "$F" || echo "  (无)"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        id: build
        working-directory: local_douyin
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: local_douyin/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop if build failed
        if: steps.build.outcome != 'success'
        run: |
          # 写进 step summary，这样失败原因在 run 页面顶部直接可见，
          # 不必下载 artifact 才能看到。
          {
            echo "## APK 构建失败"
            echo ""
            echo "### 错误关键行"
            echo '```'
            grep -n -i -E "error|failed|failure|exception|could not|unable to|no such|not found|incompatible|resolve" \
              local_douyin/build.log | tail -n 80 || true
            echo '```'
            echo ""
            echo "### 日志末尾 120 行"
            echo '```'
            tail -n 120 local_douyin/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 同时落一份到仓库，方便直接读
          mkdir -p ci-logs
          {
            echo "# 构建失败日志"
            echo ""
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 错误关键行"
            echo '```'
            grep -n -i -E "error|failed|failure|exception|could not|unable to|no such|not found|incompatible|resolve" \
              local_douyin/build.log | tail -n 120 || true
            echo '```'
            echo ""
            echo "## 日志末尾 250 行"
            echo '```'
            tail -n 250 local_douyin/build.log || true
            echo '```'
          } > ci-logs/last-failure.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/last-failure.md
          git commit -m "ci: 记录构建失败日志 [skip ci]" || echo "nothing to commit"
          # 期间可能有人往 master 推过东西，先 rebase 再推
          git pull --rebase origin master || git rebase --abort || true
          git push origin HEAD:master || echo "push failed"

          exit 1

      - name: Report APK size
        working-directory: local_douyin
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local_douyin-debug-apk
          path: local_douyin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # 把构建产物写回仓库的 apk/ 目录，让仓库里始终有一份可直接下载的包。
      # GitHub 单个文件硬上限 100 MiB = 104857600 字节，留一点余量取 104000000。
      # 超限时跳过（下面的 Release 步骤仍会提供下载）。
      # 这个提交只含 apk/ 目录，而 workflow 的 paths 过滤不含 apk/，
      # 所以不会自己触发自己，形成死循环。
      - name: Commit APK to repo
        id: commit_apk
        continue-on-error: true
        run: |
          DEST=local_douyin/apk/local_douyin.apk
          SRC=local_douyin/build/app/outputs/flutter-apk/app-debug.apk
          SIZE=$(stat -c%s "$SRC")
          echo "APK: $SIZE bytes ($((SIZE/1024/1024)) MiB)"

          if [ "$SIZE" -gt 104000000 ]; then
            echo "::warning::APK $SIZE 字节，超过 100MiB 单文件上限，跳过提交到 git（Release 附件仍可用）"
            exit 0
          fi

          mkdir -p local_douyin/apk
          cp "$SRC" "$DEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"

          if git diff --cached --quiet; then
            echo "APK 内容与仓库一致，无需提交"
            exit 0
          fi

          git commit -m "build: 更新 APK（$(date -u +%Y-%m-%d) 构建）[skip ci]"
          git pull --rebase origin master || git rebase --abort || true
          git push origin HEAD:master

      # Release 附件没有 100MiB 限制，作为稳定下载入口。
      # 不加 --prerelease：README 用的是 /releases/latest/download/ 这个地址，
      # 它只认"最新的正式发布"，标成 prerelease 会 404。
      - name: Publish APK as Release asset
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=local_douyin/build/app/outputs/flutter-apk/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          # 同名 release 和 tag 先删掉，否则 create 会报已存在
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$APK#local_douyin-debug.apk" \
            --title "最新构建 (debug)" \
            --notes "commit: ${{ github.sha }}
          构建时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          大小: $((SIZE/1024/1024)) MiB
          下载后直接安装，需要 Android 11+ 并授予所有文件访问权限。"

      - name: APK summary
        if: always()
        run: |
          {
            echo "### APK 产物"
            echo '```'
            ls -lh local_douyin/build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null || echo "未找到"
            echo '```'
            echo "提交到 git: ${{ steps.commit_apk.outcome }}"
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/latest"
          } >> "$GITHUB_STEP_SUMMARY"
