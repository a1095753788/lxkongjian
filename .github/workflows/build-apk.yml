name: Build APK

on:
  push:
    branches: [master]
    paths:
      - 'local_douyin/lib/**'
      - 'local_douyin/android/**'
      - 'local_douyin/pubspec.yaml'
      - 'local_douyin/pubspec.lock'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定 3.44.2：这是本项目 AGP 9.0.1 + Gradle 9.1.0 验证过的版本
          # （Dart 3.12.2，满足 pubspec 的 >=3.12.0 约束）
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # AGP 9.0.1 硬性要求：compileSdk 36 + build-tools >= 36.0.0 + JDK 17 + Gradle 9.1.0
      # 无条件安装，sdkmanager 对已存在的组件会直接跳过
      - name: Ensure Android SDK 36 + build-tools 36.0.0
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          echo "--- platforms ---";  ls "$SDK/platforms"  || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: Point Gradle wrapper at official distribution
        run: |
          # 仓库里 wrapper 指向腾讯云镜像（为国内网络优化），GitHub runner 在境外访问可能不通，
          # 且分发包下载失败不会 fallback，会直接中断构建。这里在 CI 环境改回官方源。
          F=local_douyin/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' "$F"
          cat "$F"

      - name: Install dependencies
        working-directory: local_douyin
        run: flutter pub get

      - name: Build debug APK
        id: build
        working-directory: local_douyin
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: local_douyin/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop if build failed
        if: steps.build.outcome != 'success'
        run: |
          mkdir -p ci-logs
          {
            echo "# 构建失败日志"
            echo
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo
            echo "## 版本信息"
            echo '```'
            flutter --version 2>&1 || true
            java -version 2>&1 || true
            echo '```'
            echo
            echo "## 错误关键行"
            echo '```'
            grep -n -i -E "error|failed|failure|exception|could not|unable to|no such|not found|incompatible" \
              local_douyin/build.log | tail -n 100 || true
            echo '```'
            echo
            echo "## 日志末尾 200 行"
            echo '```'
            tail -n 200 local_douyin/build.log || true
            echo '```'
          } > ci-logs/last-failure.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/last-failure.md
          git commit -m "ci: 记录构建失败日志 [skip ci]" || echo "nothing to commit"
          git push origin HEAD:master || echo "push failed"
          echo "::error::APK build failed — full log committed to ci-logs/last-failure.md"
          exit 1

      - name: Report APK size
        working-directory: local_douyin
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local_douyin-debug-apk
          path: local_douyin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
