name: Build APK

on:
  push:
    branches: [master]
    paths:
      - 'local_douyin/lib/**'
      - 'local_douyin/android/**'
      - 'local_douyin/pubspec.yaml'
      - 'local_douyin/pubspec.lock'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定 3.44.2：这是本项目 AGP 9.0.1 + Gradle 9.1.0 验证过的版本
          # （Dart 3.12.2，满足 pubspec 的 >=3.12.0 约束）
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # AGP 9.0.1 硬性要求：compileSdk 36 + build-tools >= 36.0.0 + JDK 17 + Gradle 9.1.0
      # 无条件安装，sdkmanager 对已存在的组件会直接跳过
      - name: Ensure Android SDK 36 + build-tools 36.0.0
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          echo "--- platforms ---";  ls "$SDK/platforms"  || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: Install dependencies
        working-directory: local_douyin
        run: flutter pub get

      - name: Build debug APK
        id: build
        working-directory: local_douyin
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: local_douyin/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::APK build failed — download the 'build-log' artifact for the full output"
          tail -n 60 local_douyin/build.log || true
          exit 1

      - name: Report APK size
        working-directory: local_douyin
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local_douyin-debug-apk
          path: local_douyin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
